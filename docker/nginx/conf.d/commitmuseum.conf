# Bootstrap config — HTTP only, serves ACME challenges and proxies the app
# in plain HTTP. This is the checked-in default so `docker compose up` works
# on a fresh clone, before any TLS certificate exists.
#
# Once you've run docker/certbot/init-letsencrypt.sh successfully, this file
# is overwritten in place with the full HTTPS version (redirect + TLS
# server block) and nginx is reloaded — see that script for details.

server {
    listen 80;
    listen [::]:80;
    server_name commitmuseum.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
